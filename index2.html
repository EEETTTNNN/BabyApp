<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Bébé - v1.7.2</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --primary-color: #4a90e2;
            --border-color: #e1e8ed;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #aaaaaa;
            --primary-color: #357abd;
            --border-color: #333333;
            --shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .theme-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-color);
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
        }

        button.btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .categories-filter {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .cat-btn {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-item.active {
            color: var(--primary-color);
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>Suivi Bébé</h1>
        <button class="theme-btn" onclick="toggleThemeModal()">⚙️</button>
    </header>

    <div class="container">
        <!-- MODAL THEME -->
        <div id="theme-modal" class="card hidden">
            <h3>Thème d'affichage</h3>
            <div class="form-group" style="margin-top: 10px;">
                <select id="theme-select" onchange="changeTheme(this.value)">
                    <option value="light">Clair</option>
                    <option value="dark">Sombre</option>
                </select>
            </div>
            <button class="btn-submit" onclick="toggleThemeModal()">Fermer</button>
        </div>

        <!-- VUE ACCUEIL / SAISIE -->
        <div id="view-home">
            <div class="card">
                <h2>Saisie manuelle</h2>
                <form id="event-form" onsubmit="saveEvent(event)" style="margin-top: 10px;">
                    <div class="form-group">
                        <label for="event-category">Catégorie</label>
                        <select id="event-category" onchange="updateSubtypes()">
                            <option value="Sommeil">Sommeil</option>
                            <option value="Couche">Couche</option>
                            <option value="Repas">Repas</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="event-subtype">Type de précision</label>
                        <select id="event-subtype">
                            <!-- Rempli dynamiquement -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="event-start">Début</label>
                        <input type="datetime-local" id="event-start" required>
                    </div>

                    <div class="form-group">
                        <label for="event-end">Fin (optionnel)</label>
                        <input type="datetime-local" id="event-end">
                    </div>

                    <button type="submit" class="btn-submit">Enregistrer</button>
                </form>
            </div>

            <div class="card">
                <h2>Événements enregistrés</h2>
                <div id="history-list" style="margin-top: 10px;">
                    <!-- L'historique complet s'affiche ici -->
                </div>
            </div>
        </div>

        <!-- VUE TENDANCES & STATS -->
        <div id="view-stats" class="hidden">
            <div class="categories-filter" id="stats-categories">
                <button class="cat-btn active" onclick="filterStats('Tous', this)">Tous 🌐</button>
                <button class="cat-btn" onclick="filterStats('Sommeil', this)">Sommeil 😴</button>
                <button class="cat-btn" onclick="filterStats('Couche', this)">Couche 👶</button>
                <button class="cat-btn" onclick="filterStats('Repas', this)">Repas 🍼</button>
            </div>

            <div class="card">
                <h2>Vue chronologique</h2>
                <div id="stats-chronological" style="margin-top: 10px;">
                    <!-- Données réelles calculées -->
                </div>
            </div>

            <div class="card">
                <h2>Tendances & Moyennes</h2>
                <div id="stats-trends" style="margin-top: 10px;">
                    <!-- Synthèse issue de l'historique -->
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-home" onclick="switchView('home')">
            <span>🏠</span>
            <span>Accueil</span>
        </button>
        <button class="nav-item" id="nav-stats" onclick="switchView('stats')">
            <span>📊</span>
            <span>Tendances</span>
        </button>
    </nav>

    <script>
        // État global
        let state = {
            theme: localStorage.getItem('theme') || 'light',
            events: JSON.parse(localStorage.getItem('events_db')) || [],
            activeFilter: 'Tous'
        };

        // Subtypes par catégorie
        const subtypes = {
            'Sommeil': ['Sieste', 'Sommeil nocturne'],
            'Couche': ['Mouillée', 'Souillée', 'Mixte'],
            'Repas': ['Biberon', 'Tétée', 'Solide']
        };

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(state.theme);
            updateSubtypes();
            setDefaultDates();
            renderHistory();
        });

        // Gestion du Thème
        function applyTheme(theme) {
            state.theme = theme;
            localStorage.setItem('theme', theme);
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('theme-select').value = theme;
        }

        function changeTheme(val) {
            applyTheme(val);
        }

        function toggleThemeModal() {
            document.getElementById('theme-modal').classList.toggle('hidden');
        }

        // Gestion des sous-types dans le formulaire
        function updateSubtypes() {
            const cat = document.getElementById('event-category').value;
            const select = document.getElementById('event-subtype');
            select.innerHTML = '';
            subtypes[cat].forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = sub;
                select.appendChild(opt);
            });
        }

        function setDefaultDates() {
            const now = new Date();
            const localIso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            document.getElementById('event-start').value = localIso;
        }

        // Navigation
        function switchView(view) {
            if (view === 'home') {
                document.getElementById('view-home').classList.remove('hidden');
                document.getElementById('view-stats').classList.add('hidden');
                document.getElementById('nav-home').classList.add('active');
                document.getElementById('nav-stats').classList.remove('active');
            } else {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-stats').classList.remove('hidden');
                document.getElementById('nav-home').classList.remove('active');
                document.getElementById('nav-stats').classList.add('active');
                renderStats();
            }
        }

        // Sauvegarde d'un événement
        function saveEvent(e) {
            e.preventDefault();
            const newEvent = {
                id: Date.now(),
                category: document.getElementById('event-category').value,
                subtype: document.getElementById('event-subtype').value,
                start: document.getElementById('event-start').value,
                end: document.getElementById('event-end').value || null
            };

            state.events.unshift(newEvent);
            localStorage.setItem('events_db', JSON.stringify(state.events));
            renderHistory();
            setDefaultDates();
            document.getElementById('event-end').value = '';
        }

        // Rendu de l'historique complet (Accueil)
        function renderHistory() {
            const container = document.getElementById('history-list');
            if (state.events.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">Aucun événement enregistré.</p>';
                return;
            }

            container.innerHTML = state.events.map(ev => {
                const startDate = new Date(ev.start).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
                const endDate = ev.end ? new Date(ev.end).toLocaleTimeString('fr-FR', { timeStyle: 'short' }) : '';
                const timeDisplay = endDate ? `${startDate} - ${endDate}` : startDate;

                return `
                    <div class="history-item">
                        <div>
                            <strong>${ev.category}</strong> (${ev.subtype})<br>
                            <small style="color: var(--text-secondary);">${timeDisplay}</small>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Rendu des Statistiques & Tendances Réelles
        function filterStats(cat, btn) {
            state.activeFilter = cat;
            document.querySelectorAll('#stats-categories .cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderStats();
        }

        function renderStats() {
            const filtered = state.activeFilter === 'Tous' 
                ? state.events 
                : state.events.filter(e => e.category === state.activeFilter);

            const chronoContainer = document.getElementById('stats-chronological');
            const trendsContainer = document.getElementById('stats-trends');

            if (filtered.length === 0) {
                chronoContainer.innerHTML = '<p style="color: var(--text-secondary);">Aucune donnée pour cette sélection.</p>';
                trendsContainer.innerHTML = '<p style="color: var(--text-secondary);">Données insuffisantes.</p>';
                return;
            }

            // Vue chronologique basée sur l'historique réel
            chronoContainer.innerHTML = filtered.slice(0, 10).map(ev => {
                const date = new Date(ev.start).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
                return `
                    <div class="history-item">
                        <span>${date}</span>
                        <span><strong>${ev.category}</strong> - ${ev.subtype}</span>
                    </div>
                `;
            }).join('');

            // Tendances réelles basées sur le décompte des entrées
            const count = filtered.length;
            trendsContainer.innerHTML = `
                <p>Total d'entrées (${state.activeFilter}) : <strong>${count}</strong></p>
                <p>Dernière saisie : <strong>${new Date(filtered[0].start).toLocaleString('fr-FR')}</strong></p>
            `;
        }
    </script>
</body>
</html>
